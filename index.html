<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>漢字でGOGO! FAQ</title>
<link rel="icon" href="img/Fav.ico" type="image/x-icon" sizes="any">
<link rel="shortcut icon" href="img/Fav.ico" type="image/x-icon">
<style>
@font-face{
  font-family:"NotoSansJPBold";
  src:url("fonts/NotoSansJP-Bold.otf") format("opentype");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"NotoSansJPBold";
  src:url("fonts/NotoSansJP-Bold.otf") format("opentype");
  font-weight:700;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"NotoSansJPBold";
  src:url("fonts/NotoSansJP-Bold.otf") format("opentype");
  font-weight:900;
  font-style:normal;
  font-display:swap;
}
:root{
  --bg:#2a1115;
  --bg-deep:#1b0a0d;
  --panel:#5a2028;
  --panel-2:#732932;
  --panel-3:#42171d;
  --edge:rgba(255,255,255,.16);
  --edge-strong:rgba(255,255,255,.28);
  --text:#ffffff;
  --muted:rgba(255,255,255,.74);
  --soft:rgba(255,255,255,.09);
  --accent:#f0a0aa;
  --accent-2:#ffd3d8;
  --warning:#ffe08a;
  --text-outline:1.5px 2px 0 rgba(0,0,0,.35);
  --shadow:none;
  --radius:0;
  --font:"NotoSansJPBold","Noto Sans JP","Meiryo","Hiragino Kaku Gothic ProN",sans-serif;
  --mono:"Cascadia Mono","Consolas","Menlo",monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  color:var(--text);
  font:16px/1.8 var(--font);
  background:var(--bg);
  min-height:100vh;
  text-shadow:var(--text-outline);
}
button,input,textarea,select{
  text-shadow:var(--text-outline);
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background:url("img/Mode_bg.png") repeat;
  background-size:320px 320px;
  opacity:.24;
  image-rendering:auto;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:rgba(27,10,13,.42);
  pointer-events:none;
}
a{color:var(--accent-2); text-decoration-thickness:1px; text-underline-offset:4px;}
a:hover{color:#fff;}
.site-header{
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(14px);
  background:rgba(42,17,21,.94);
  border-bottom:1px solid var(--edge);
}
.header-inner{
  max-width:1180px;
  margin:0 auto;
  padding:14px 20px;
  display:grid;
  grid-template-columns:1fr minmax(320px, 470px);

  align-items:center;
}
.brand{display:flex; align-items:center; gap:12px; min-width:0;}
.brand-logo{
  display:block;
  width:256px;

}
.header-actions{

  align-items:center;

}
.history-tab{

  border-radius:0;
  background:rgba(255,255,255,.09);
  color:#fff;
  padding:10px 14px;
  font:700 14px var(--font);
  line-height:1.2;
  cursor:pointer;
  white-space:nowrap;
}
.history-tab:hover,.history-tab[aria-expanded="true"]{
  border-color:rgba(255,211,216,.72);
  background:rgba(255,211,216,.16);
}
.history-tab[hidden]{display:none;}
.search-box{position:relative;}
.search-box input{
  width:100%;
  border:1px solid var(--edge-strong);
  border-radius:0;
  background:rgba(255,255,255,.09);
  color:#fff;
  padding:10px 42px 10px 16px;
  font:15px var(--font);
  outline:none;
}
.search-box input::placeholder{color:rgba(255,255,255,.62); text-shadow:var(--text-outline);}
.search-box input:focus{border-color:rgba(255,211,216,.72); box-shadow:none;}
.search-box::after{content:"⌕"; position:absolute; right:16px; top:50%; transform:translateY(-50%); color:rgba(255,255,255,.64); font-size:18px;}
.history-panel{
  border-top:1px solid rgba(255,255,255,.08);
  background:rgba(42,17,21,.96);
}
.history-panel[hidden]{display:none;}
.history-panel-inner{
  max-width:1180px;
  margin:0 auto;
  padding:0 20px 16px;
}
.history-card{
  border:1px solid var(--edge);
  border-radius:0;
  background:rgba(18,6,8,.55);
  box-shadow:none;
  padding:12px 14px;
}
.history-last{
  margin:0 0 8px;
  color:var(--accent-2);
  font-weight:700;
}
.history-log{
  max-height:160px;
  overflow:auto;
  padding:10px 12px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:0;
  background:rgba(255,255,255,.06);
  color:var(--muted);
  font-family:var(--mono);

}
.history-empty{color:var(--muted);}
.hero{

}
.hero-card{

}

.toc-list{display:grid; gap:2px; padding:8px;}
.toc-list a{

.content{

}
.faq-card{

  border-radius:0;

}
.md-content h4{

.md-content p{margin:10px 0;}
.md-content blockquote{
  margin:14px 0;

.md-content ul,.md-content ol{padding-left:1.4em; margin:10px 0;}
.md-content li{margin:4px 0;}
.md-content hr{border:none; border-top:1px solid var(--edge); margin:26px 0;}
.md-content code{

}
.md-content pre{

}
.md-content pre code{background:transparent; border:0; padding:0; border-radius:0;}
.table-wrap{width:100%; overflow-x:auto; margin:14px 0; border-radius:0; border:1px solid var(--edge);}
table{width:100%; border-collapse:collapse; min-width:520px; background:rgba(255,255,255,.04);}
th,td{padding:11px 12px; border-bottom:1px solid rgba(255,255,255,.12); text-align:left; vertical-align:top;}
th{background:rgba(255,255,255,.12); color:var(--accent-2); font-weight:700;}
tr:last-child td{border-bottom:0;}
.md-content img{

  max-width:100%;

  margin:16px auto;

.badge,.md-content .tag{

.site-footer{

  margin:0 auto;
  padding:24px 20px 40px;

@media (max-width:860px){

    width:200px;

    flex-basis:200px;
  }
  .hero{padding-top:28px;}
  .hero-card{padding:24px;}
  .layout{grid-template-columns:1fr;}
  .toc{position:static;}
  .content{padding:18px;}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}}

<body data-md="faq.md">
<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-logo" role="img" aria-label="漢字でGOGO! 公式FAQ"></div>
    </div>
    <div class="header-actions">
      <button class="history-tab" id="historyToggle" type="button" aria-expanded="false" aria-controls="historyPanel" hidden>更新履歴</button>
      <label class="search-box" aria-label="FAQ内を検索">
        <input id="searchInput" type="search" placeholder="質問を検索">
      </label>
    </div>
  </div>
  <div class="history-panel" id="historyPanel" hidden>
    <div class="history-panel-inner">
      <div class="history-card" id="historyContent"><span class="history-empty">更新履歴を読み込んでいます…</span></div>
    </div>
  </div>
</header>
<section class="hero">
  <div class="hero-card">
    <h2>よくある質問</h2>
    <p>本ゲームで起こりうる質問に対しての回答を記載しております。</p>
  </div>
</section>
<div class="layout">
  <nav class="toc" aria-label="目次">
    <div class="toc-title">目次</div>
    <div class="toc-list" id="tocList"><span style="padding:8px 10px;color:var(--muted);font-size:14px;">読み込み中…</span></div>
  </nav>
  <main class="content">
    <div id="noResults" class="no-results">該当する質問が見つかりませんでした。</div>
    <article class="md-content" id="content"><div class="loading">faq.md を読み込んでいます…</div></article>
  </main>
</div>
<footer class="site-footer">© 漢字でGOGO! / Micelle All rights reserved</footer>
<script>
(function(){
'use strict';
const content = document.getElementById('content');
const tocList = document.getElementById('tocList');
const searchInput = document.getElementById('searchInput');
const noResults = document.getElementById('noResults');
const historyToggle = document.getElementById('historyToggle');
const historyPanel = document.getElementById('historyPanel');
const historyContent = document.getElementById('historyContent');
const MD_FILE = document.body.dataset.md || 'faq.md';
const customColor = {
  sk:'#9fc5ff', li:'#b9f59e', vi:'#cdb7ff',
  accent:'#ffd3d8', warn:'#ffe08a', mute:'rgba(255,255,255,.72)'
};
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s).replace(/`/g,'&#96;'); }
function slug(s){
  const base = String(s).replace(/<[^>]+>/g,'').trim().toLowerCase()
    .replace(/[\s　]+/g,'-').replace(/[!"#$%&'()*+,./:;<=>?@[\\\]^`{|}~]/g,'');
  return base || 'section';
}
function uniqueSlugFactory(){
  const used = new Map();
  return function(text){
    let id = slug(text);
    const n = used.get(id) || 0;
    used.set(id, n + 1);
    if(n) id += '-' + (n + 1);
    return id;
  };
}
function colorizeEscaped(html){
  let t = html;
  t = t.replace(/&lt;s=(?:&quot;|&#39;|&apos;|['"]|)([^&"'>\s]+?)(?:&quot;|&#39;|&apos;|['"]|)&gt;([\s\S]*?)&lt;\/s&gt;/g,
    (_, size, inner) => `<span style="font-size:${escapeAttr(size)}">${inner}</span>`);
  t = t.replace(/&lt;f=(?:&quot;|&#39;|&apos;|['"]|)([^&"'>]+?)(?:&quot;|&#39;|&apos;|['"]|)&gt;([\s\S]*?)&lt;\/f&gt;/g,
    (_, font, inner) => `<span style="font-family:'${escapeAttr(font)}', var(--font), sans-serif">${inner}</span>`);
  t = t.replace(/&lt;(?:c|col)=(?:&quot;|&#39;|&apos;|['"]|)([^&"'>\s]+?)(?:&quot;|&#39;|&apos;|['"]|)&gt;([\s\S]*?)&lt;\/(?:c|col)&gt;/g,
    (_, color, inner) => `<span style="color:${customColor[color] || escapeAttr(color)}">${inner}</span>`);
  t = t.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
  return t;
}
function inline(src){
  const codeParts = [];
  let s = String(src).replace(/`([^`\n]+?)`/g, (_, code) => {
    const key = `\u0000CODE${codeParts.length}\u0000`;
    codeParts.push(`<code>${escapeHtml(code)}</code>`);
    return key;
  });
  s = escapeHtml(s);
  s = colorizeEscaped(s);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;([^&]*)&quot;)?\)/g, (_, alt, url, title) => {
    return `<img src="${escapeAttr(url)}" alt="${escapeAttr(alt)}"${title ? ` title="${escapeAttr(title)}"` : ''}>`;
  });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;([^&]*)&quot;)?\)/g, (_, text, url, title) => {
    return `<a href="${escapeAttr(url)}"${title ? ` title="${escapeAttr(title)}"` : ''}>${text}</a>`;
  });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/_([^_]+)_/g, '<em>$1</em>');
  codeParts.forEach((html, i) => { s = s.replace(`\u0000CODE${i}\u0000`, html); });
  return s;
}
function isTableSep(line){
  if(!line.includes('|')) return false;
  const cells = splitTableRow(line);
  return cells.length > 0 && cells.every(c => /^:?-{3,}:?$/.test(c.trim()));
}
function splitTableRow(line){
  const marker = '\u0000PIPE\u0000';
  let s = line.trim().replace(/\\\|/g, marker);
  if(s.startsWith('|')) s = s.slice(1);
  if(s.endsWith('|')) s = s.slice(0, -1);
  return s.split('|').map(c => c.replaceAll(marker, '|').trim());
}
function renderTable(lines){
  const header = splitTableRow(lines[0]);
  const rows = lines.slice(2).map(splitTableRow);
  let html = '<div class="table-wrap"><table><thead><tr>';
  html += header.map(c => `<th>${inline(c)}</th>`).join('');
  html += '</tr></thead><tbody>';
  html += rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('');
  html += '</tbody></table></div>';
  return html;
}
function isLooseTableLine(line){
  if(!line.includes('|') || line.includes('\\|')) return false;
  const cells = splitTableRow(line);
  return cells.length >= 2 && cells.some(c => c.trim() !== '');
}
function renderLooseTable(lines){
  const rows = lines.map(splitTableRow);
  let html = '<div class="table-wrap"><table><tbody>';
  html += rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('');
  html += '</tbody></table></div>';
  return html;
}
function renderMarkdown(md){
  const makeId = uniqueSlugFactory();
  const lines = String(md).replace(/\r\n?/g,'\n').split('\n');
  let html = '';
  let paragraph = [];
  let listStack = [];
  let inCode = false;
  let code = [];
  let inFaq = false;
  function closeLists(){ while(listStack.length){ html += `</${listStack.pop()}>`; } }
  function closeFaq(){ if(inFaq){ closeLists(); html += '</article>'; inFaq = false; } }
  function flushParagraph(){
    if(!paragraph.length) return;
    html += `<p>${inline(paragraph.join('\n')).replace(/\n/g,'<br>')}</p>`;
    paragraph = [];
  }
  for(let i=0; i<lines.length; i++){
    const line = lines[i];
    if(/^```/.test(line.trim())){
      flushParagraph(); closeLists();
      if(inCode){ html += `<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`; code = []; inCode = false; }
      else{ inCode = true; }
      continue;
    }
    if(inCode){ code.push(line); continue; }
    if(line.includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1])){
      flushParagraph(); closeLists();
      const block = [line, lines[i + 1]];
      i += 2;
      while(i < lines.length && lines[i].includes('|') && lines[i].trim() !== ''){ block.push(lines[i]); i++; }
      i--;
      html += renderTable(block);
      continue;
    }
    if(isLooseTableLine(line)){
      flushParagraph(); closeLists();
      const block = [line];
      let j = i + 1;
      while(j < lines.length && isLooseTableLine(lines[j]) && !isTableSep(lines[j])){
        block.push(lines[j]);
        j++;
      }
      html += renderLooseTable(block);
      i = j - 1;
      continue;
    }
    const heading = line.match(/^(#{1,4})\s+(.+)$/);
    if(heading){
      flushParagraph(); closeLists();
      const level = heading[1].length;
      const text = heading[2].trim();
      const id = makeId(text);
      if(level <= 2){ closeFaq(); html += `<h${level} id="${id}">${inline(text)}</h${level}>`; }
      else if(level === 3){ closeFaq(); html += `<article class="faq-card"><h3 id="${id}">${inline(text)}</h3>`; inFaq = true; }
      else{ html += `<h4 id="${id}">${inline(text)}</h4>`; }
      continue;
    }
    if(/^\s*---+\s*$/.test(line)){ flushParagraph(); closeLists(); html += '<hr>'; continue; }
    if(/^>\s?/.test(line)){ flushParagraph(); closeLists(); html += `<blockquote>${inline(line.replace(/^>\s?/,''))}</blockquote>`; continue; }
    const ul = line.match(/^(\s*)[-*+]\s+(.+)$/);
    const ol = line.match(/^(\s*)\d+\.\s+(.+)$/);
    if(ul || ol){
      flushParagraph();
      const m = ul || ol;
      const type = ul ? 'ul' : 'ol';
      const depth = Math.floor(m[1].length / 2) + 1;
      while(listStack.length > depth){ html += `</${listStack.pop()}>`; }
      if(listStack.length === depth && listStack[depth - 1] !== type){ html += `</${listStack.pop()}>`; }
      while(listStack.length < depth){ html += `<${type}>`; listStack.push(type); }
      html += `<li>${inline(m[2])}</li>`;
      continue;
    }
    if(line.trim() === ''){ flushParagraph(); closeLists(); continue; }
    if(listStack.length) closeLists();
    paragraph.push(line);
  }
  if(inCode){ html += `<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`; }
  flushParagraph(); closeLists(); closeFaq();
  return html;
}

function decodeHtmlEntities(s){
  const textarea = document.createElement('textarea');
  textarea.innerHTML = String(s);
  return textarea.value;
}
function htmlToPlainText(html){
  return decodeHtmlEntities(String(html)
    .replace(/<\s*\/\s*br\s*>/gi, '\n')
    .replace(/<\s*br\s*\/?\s*>/gi, '\n')
    .replace(/<[^>]+>/g, '')
    .replace(/\n{3,}/g, '\n\n'))
    .trim();
}
function extractHistory(md){
  let body = String(md);
  let history = '';
  const marked = body.match(/<!--\s*(?:history|update-history|更新履歴):start\s*-->([\s\S]*?)<!--\s*(?:history|update-history|更新履歴):end\s*-->/i);
  if(marked){
    history = marked[1].trim();
    body = body.replace(marked[0], '').trimStart();
    return {body, history};
  }
  const legacy = body.match(/^\s*<!--\s*よくある質問（FAQ）\s*-->\s*(<strong[\s\S]*?最終更新日[\s\S]*?<\/strong>)\s*(<div[^>]*overflow\s*:\s*auto[^>]*>[\s\S]*?<\/div>)\s*(?:<br\s*\/?>|<\/br>)?/i);
  if(legacy){
    history = `${htmlToPlainText(legacy[1])}\n\n${htmlToPlainText(legacy[2])}`.trim();
    body = body.replace(legacy[0], '').trimStart();
  }
  return {body, history};
}
function renderHistory(history){
  const text = String(history || '').replace(/\r\n?/g, '\n').trim();
  if(!text) return '<span class="history-empty">faq.md の上部に更新履歴ブロックを追加すると、ここに表示されます。</span>';
  const lines = text.split('\n');
  const first = lines[0].trim();
  const hasLastUpdate = /^最終更新日/.test(first);
  const lastUpdate = hasLastUpdate ? lines.shift().trim() : '更新履歴';
  const log = lines.join('\n').trim();
  return `<p class="history-last">${inline(lastUpdate)}</p><div class="history-log">${escapeHtml(log || '更新内容なし')}</div>`;
}
function setHistoryVisible(hasHistory){
  historyToggle.hidden = !hasHistory;
  if(!hasHistory){
    historyPanel.hidden = true;
    historyToggle.setAttribute('aria-expanded', 'false');
  }
}

function buildToc(){
  const heads = Array.from(content.querySelectorAll('h2'));
  tocList.innerHTML = heads.length ? heads.map(h => `<a href="#${h.id}">${h.textContent}</a>`).join('') : '<span style="padding:8px 10px;color:var(--muted);font-size:14px;">項目なし</span>';
}
function applySearch(){
  const q = searchInput.value.trim().toLowerCase();
  const cards = Array.from(content.querySelectorAll('.faq-card'));
  let visible = 0;
  cards.forEach(card => {
    const hit = !q || card.textContent.toLowerCase().includes(q);
    card.style.display = hit ? '' : 'none';
    if(hit) visible++;
  });
  noResults.style.display = (q && cards.length && visible === 0) ? 'block' : 'none';
}
async function load(){
  try{
    const res = await fetch(MD_FILE, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const md = await res.text();
    const extracted = extractHistory(md);
    const hasHistory = !!extracted.history.trim();
    historyContent.innerHTML = renderHistory(extracted.history);
    setHistoryVisible(hasHistory);
    content.innerHTML = renderMarkdown(extracted.body);
    buildToc();
    applySearch();
  }catch(err){
    setHistoryVisible(false);
    content.innerHTML = `<div class="error-message"><strong>faq.md を読み込めませんでした。</strong><br>GitHub PagesなどのWebサーバー上で開いてください。ローカル確認の場合は、VS CodeのLive Server等を使うと読み込めます。<br><code>${escapeHtml(err.message || err)}</code></div>`;
    tocList.innerHTML = '<span style="padding:8px 10px;color:var(--muted);font-size:14px;">読み込み失敗</span>';
  }
}
searchInput.addEventListener('input', applySearch);
historyToggle.addEventListener('click', () => {
  const open = historyPanel.hidden;
  historyPanel.hidden = !open;
  historyToggle.setAttribute('aria-expanded', String(open));
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !historyPanel.hidden){
    historyPanel.hidden = true;
    historyToggle.setAttribute('aria-expanded', 'false');
  }
});
load();
})();
</script>
</body>
</html>
