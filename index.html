<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>漢字でGOGO! FAQ</title>
<link rel="icon" href="img/Fav.ico" type="image/x-icon" sizes="any">
<link rel="shortcut icon" href="img/Fav.ico" type="image/x-icon">
<style>
@font-face{
  font-family:"NotoSansJPBold";
  src:url("fonts/NotoSansJP-Bold.otf") format("opentype");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"NotoSansJPBold";
  src:url("fonts/NotoSansJP-Bold.otf") format("opentype");
  font-weight:700;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"NotoSansJPBold";
  src:url("fonts/NotoSansJP-Bold.otf") format("opentype");
  font-weight:900;
  font-style:normal;
  font-display:swap;
}
:root{
  --bg:#2a1115;
  --bg-deep:#1b0a0d;
  --panel:#5a2028;
  --panel-2:#732932;
  --panel-3:#42171d;
  --edge:rgba(255,255,255,.16);
  --edge-strong:rgba(255,255,255,.28);
  --text:#ffffff;
  --muted:rgba(255,255,255,.74);
  --soft:rgba(255,255,255,.09);
  --accent:#f0a0aa;
  --accent-2:#ffd3d8;
  --warning:#ffe08a;
  --text-outline:1.5px 2px 0 rgba(0,0,0,.35);
  --shadow:none;
  --radius:0;
  --font:"NotoSansJPBold","Noto Sans JP","Meiryo","Hiragino Kaku Gothic ProN",sans-serif;
  --mono:"Cascadia Mono","Consolas","Menlo",monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  color:var(--text);
  font:16px/1.8 var(--font);
  background:var(--bg);
  min-height:100vh;
  text-shadow:var(--text-outline);
}
button,input,textarea,select{
  text-shadow:var(--text-outline);
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background:url("img/Mode_bg.png") repeat;
  background-size:320px 320px;
  opacity:.24;
  image-rendering:auto;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:rgba(27,10,13,.42);
  pointer-events:none;
}
a{color:var(--accent-2); text-decoration-thickness:1px; text-underline-offset:4px;}
a:hover{color:#fff;}
.site-header{
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(14px);
  background:rgba(42,17,21,.94);
  border-bottom:1px solid var(--edge);
}
.header-inner{
  max-width:1180px;
  margin:0 auto;
  padding:14px 20px;
  display:grid;
  grid-template-columns:1fr minmax(320px, 470px);
  gap:16px;
  align-items:center;
}
.brand{display:flex; align-items:center; gap:12px; min-width:0;}
.brand-logo{
  display:block;
  width:256px;
  height:64px;
  background:url("img/Faq_Logo.png") center/contain no-repeat;
  flex:0 0 256px;
}
.header-actions{
  display:grid;
  grid-template-columns:auto minmax(220px, 340px);
  gap:10px;
  align-items:center;
  justify-content:end;
}
.history-tab{
  border:1px solid var(--edge-strong);
  border-radius:0;
  background:rgba(255,255,255,.09);
  color:#fff;
  padding:10px 14px;
  font:700 14px var(--font);
  line-height:1.2;
  cursor:pointer;
  white-space:nowrap;
}
.history-tab:hover,.history-tab[aria-expanded="true"]{
  border-color:rgba(255,211,216,.72);
  background:rgba(255,211,216,.16);
}
.history-tab[hidden]{display:none;}
.search-box{position:relative;}
.search-box input{
  width:100%;
  border:1px solid var(--edge-strong);
  border-radius:0;
  background:rgba(255,255,255,.09);
  color:#fff;
  padding:10px 42px 10px 16px;
  font:15px var(--font);
  outline:none;
}
.search-box input::placeholder{color:rgba(255,255,255,.62); text-shadow:var(--text-outline);}
.search-box input:focus{border-color:rgba(255,211,216,.72); box-shadow:none;}
.search-box::after{content:"⌕"; position:absolute; right:16px; top:50%; transform:translateY(-50%); color:rgba(255,255,255,.64); font-size:18px;}
.history-panel{
  border-top:1px solid rgba(255,255,255,.08);
  background:rgba(42,17,21,.96);
}
.history-panel[hidden]{display:none;}
.history-panel-inner{
  max-width:1180px;
  margin:0 auto;
  padding:0 20px 16px;
}
.history-card{
  border:1px solid var(--edge);
  border-radius:0;
  background:rgba(18,6,8,.55);
  box-shadow:none;
  padding:12px 14px;
}
.history-last{
  margin:0 0 8px;
  color:var(--accent-2);
  font-weight:700;
}
.history-log{
  max-height:160px;
  overflow:auto;
  padding:10px 12px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:0;
  background:rgba(255,255,255,.06);
  color:var(--muted);
  font-family:var(--mono);
  font-size:13px;
  line-height:1.65;
  white-space:pre-wrap;
}
.history-empty{color:var(--muted);}
.hero{
  max-width:1180px;
  margin:0 auto;
  padding:46px 20px 24px;
}
.hero-card{
  border:1px solid var(--edge);
  border-radius:0;
  background:var(--panel-2);
  box-shadow:none;
  padding:34px;
  overflow:hidden;
  position:relative;
}
.hero h2{margin:0 0 10px; font-size:clamp(28px, 5vw, 48px); line-height:1.15; letter-spacing:.03em;}
.hero p{margin:0; max-width:760px; color:var(--muted);}
.layout{
  max-width:1180px;
  margin:0 auto 64px;
  padding:0 20px;
  display:grid;
  grid-template-columns:260px minmax(0, 1fr);
  gap:24px;
  align-items:start;
}
.toc{
  position:sticky;
  top:92px;
  border:1px solid var(--edge);
  border-radius:0;
  background:rgba(66,23,29,.72);
  box-shadow:none;
  overflow:hidden;
}
.toc-title{padding:14px 16px; border-bottom:1px solid var(--edge); color:var(--accent-2); font-weight:700;}
.toc-list{display:grid; gap:2px; padding:8px;}
.toc-list a{
  display:block;
  padding:8px 10px;
  border-radius:0;
  color:var(--muted);
  text-decoration:none;
  font-size:14px;
  line-height:1.45;
}
.toc-list a:hover{background:rgba(255,255,255,.08); color:#fff;}
.content{
  min-width:0;
  border:1px solid var(--edge);
  border-radius:0;
  background:rgba(50,18,23,.72);
  box-shadow:none;
  padding:26px;
}
.loading,.error-message,.empty-message{
  border:1px solid var(--edge);
  border-radius:0;
  background:rgba(255,255,255,.08);
  padding:18px;
  color:var(--muted);
}
.md-content h1,.md-content h2,.md-content h3,.md-content h4{line-height:1.45; color:#fff;}
.md-content h1{
  margin:0 0 18px;
  padding:16px 18px;
  border-radius:0;
  background:var(--panel-2);
  font-size:26px;
  letter-spacing:.04em;
}
.md-content h2{
  margin:34px 0 16px;
  padding:11px 16px;
  border-radius:0;
  background:#7c2b36;
  border:1px solid var(--edge);
  font-size:21px;
}
.md-content > :first-child{
  margin-top:0;
}
.faq-card{
  margin:14px 0;
  padding:18px 18px 16px;
  border:1px solid var(--edge);
  border-radius:0;
  background:rgba(255,255,255,.07);
}
.faq-card h3{
  margin:0 0 10px;
  font-size:18px;
  color:var(--accent-2);
}
.md-content h4{
  margin:18px 0 8px;
  color:var(--accent-2);
  font-size:16px;
}
.md-content p{margin:10px 0;}
.md-content blockquote{
  margin:14px 0;
  padding:12px 14px;
  border-left:5px solid var(--accent);
  border-radius:0;
  background:rgba(255,255,255,.07);
  color:var(--muted);
}
.md-content ul,.md-content ol{padding-left:1.4em; margin:10px 0;}
.md-content li{margin:4px 0;}
.md-content hr{border:none; border-top:1px solid var(--edge); margin:26px 0;}
.md-content code{
  font-family:var(--mono);
  background:rgba(255,255,255,.13);
  color:#fff;
  border:1px solid rgba(255,255,255,.11);
  border-radius:0;
  padding:.08em .42em;
}
.md-content pre{
  margin:14px 0;
  padding:14px;
  overflow:auto;
  border-radius:0;
  border:1px solid var(--edge);
  background:rgba(18,6,8,.70);
}
.md-content pre code{background:transparent; border:0; padding:0; border-radius:0;}
.mermaid-viewer{
  margin:16px 0 22px;
  overflow:hidden;
  border:1px solid var(--edge);
  background:rgba(18,6,8,.46);
}
.mermaid-toolbar{
  min-height:46px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:8px 10px 8px 14px;
  border-bottom:1px solid var(--edge);
  background:rgba(255,255,255,.07);
}
.mermaid-help{
  min-width:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}
.mermaid-actions{
  display:flex;
  align-items:center;
  gap:6px;
  flex:0 0 auto;
}
.mermaid-actions button{
  min-width:34px;
  height:30px;
  border:1px solid var(--edge-strong);
  border-radius:0;
  background:rgba(255,255,255,.10);
  color:#fff;
  padding:0 9px;
  font:700 13px/1 var(--font);
  cursor:pointer;
}
.mermaid-actions button:hover,
.mermaid-actions button:focus-visible{
  border-color:rgba(255,211,216,.78);
  background:rgba(255,211,216,.17);
  outline:none;
}
.mermaid-scale{
  width:48px;
  color:var(--muted);
  font:12px/1 var(--mono);
  text-align:center;
  text-shadow:none;
}
.mermaid-viewport{
  position:relative;
  width:100%;
  height:440px;
  overflow:hidden;
  cursor:grab;
  touch-action:none;
  user-select:none;
  outline:none;
  background-color:#f7f8fb;
  background-image:
    linear-gradient(rgba(76,120,168,.10) 1px, transparent 1px),
    linear-gradient(90deg, rgba(76,120,168,.10) 1px, transparent 1px);
  background-size:24px 24px;
}
.mermaid-viewport.is-dragging{cursor:grabbing;}
.mermaid-viewport:focus-visible{
  box-shadow:inset 0 0 0 3px rgba(240,160,170,.72);
}
.mermaid-stage{
  position:absolute;
  left:0;
  top:0;
  transform-origin:0 0;
  will-change:transform;
}
.mermaid-stage,
.mermaid-stage *{
  text-shadow:none;
}
.mermaid-stage svg{
  display:block;
  max-width:none !important;
  height:auto;
}
.mermaid-status{
  width:max-content;
  max-width:calc(100vw - 90px);
  padding:12px 16px;
  border:1px solid rgba(76,120,168,.28);
  background:#fff;
  color:#334155;
  font-size:14px;
  line-height:1.6;
}
.mermaid-status.is-error{
  border-color:#c33c2e;
  color:#8a251d;
}
.mermaid-source-wrap{
  border-top:1px solid var(--edge);
  background:rgba(18,6,8,.40);
}
.mermaid-source-wrap summary{
  padding:9px 14px;
  color:var(--muted);
  font-size:13px;
  cursor:pointer;
}
.md-content .mermaid-source{
  max-height:320px;
  margin:0;
  border-width:1px 0 0;
}
.table-wrap{width:100%; overflow-x:auto; margin:14px 0; border-radius:0; border:1px solid var(--edge);}
table{width:100%; border-collapse:collapse; min-width:520px; background:rgba(255,255,255,.04);}
th,td{padding:11px 12px; border-bottom:1px solid rgba(255,255,255,.12); text-align:left; vertical-align:top;}
th{background:rgba(255,255,255,.12); color:var(--accent-2); font-weight:700;}
tr:last-child td{border-bottom:0;}
.md-content img{
  display:block;
  max-width:100%;
  height:auto;
  margin:16px auto;
  border-radius:0;
  border:1px solid var(--edge);
  box-shadow:none;
}
.md-content video,
.md-content .md-video{
  display:block;
  max-width:100%;
  height:auto;
  margin:16px auto;
  border-radius:0;
  border:1px solid var(--edge);
  box-shadow:none;
  background:#000;
}
.badge,.md-content .tag{
  display:inline-block;
  padding:.05em .5em;
  border-radius:0;
  background:rgba(255,255,255,.13);
  color:var(--accent-2);
}
.no-results{display:none; margin:16px 0; padding:16px; border-radius:0; background:rgba(255,255,255,.08); color:var(--muted);}
.site-footer{
  max-width:1180px;
  margin:0 auto;
  padding:24px 20px 40px;
  color:rgba(255,255,255,.58);
  font-size:13px;
}
@media (max-width:860px){
  .header-inner{grid-template-columns:1fr; gap:10px;}
  .header-actions{grid-template-columns:1fr; justify-content:stretch;}
  .history-tab{width:100%;}
  .brand-logo{
    width:200px;
    height:50px;
    flex-basis:200px;
  }
  .hero{padding-top:28px;}
  .hero-card{padding:24px;}
  .layout{grid-template-columns:1fr;}
  .toc{position:static;}
  .content{padding:18px;}
  .mermaid-toolbar{align-items:flex-start; flex-direction:column;}
  .mermaid-actions{width:100%;}
  .mermaid-actions button[data-mermaid-action="reset"]{margin-left:auto;}
  .mermaid-viewport{height:360px;}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}}
</style>
</head>
<body data-md="faq.md">
<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-logo" role="img" aria-label="漢字でGOGO! 公式FAQ"></div>
    </div>
    <div class="header-actions">
      <button class="history-tab" id="historyToggle" type="button" aria-expanded="false" aria-controls="historyPanel" hidden>更新履歴</button>
      <label class="search-box" aria-label="FAQ内を検索">
        <input id="searchInput" type="search" placeholder="質問を検索">
      </label>
    </div>
  </div>
  <div class="history-panel" id="historyPanel" hidden>
    <div class="history-panel-inner">
      <div class="history-card" id="historyContent"><span class="history-empty">更新履歴を読み込んでいます…</span></div>
    </div>
  </div>
</header>
<section class="hero">
  <div class="hero-card">
    <h2>よくある質問</h2>
    <p>本ゲームで起こりうる／実際にあった質問に対しての回答を記載しております。</p>
  </div>
</section>
<div class="layout">
  <nav class="toc" aria-label="目次">
    <div class="toc-title">目次</div>
    <div class="toc-list" id="tocList"><span style="padding:8px 10px;color:var(--muted);font-size:14px;">読み込み中…</span></div>
  </nav>
  <main class="content">
    <div id="noResults" class="no-results">該当する質問が見つかりませんでした。</div>
    <article class="md-content" id="content"><div class="loading">faq.md を読み込んでいます…</div></article>
  </main>
</div>
<footer class="site-footer">© 漢字でGOGO! / Micelle All rights reserved</footer>
<script>
(function(){
'use strict';
const content = document.getElementById('content');
const tocList = document.getElementById('tocList');
const searchInput = document.getElementById('searchInput');
const noResults = document.getElementById('noResults');
const historyToggle = document.getElementById('historyToggle');
const historyPanel = document.getElementById('historyPanel');
const historyContent = document.getElementById('historyContent');
const MD_FILE = document.body.dataset.md || 'faq.md';
const MERMAID_MODULE_URL = 'https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.esm.min.mjs';
let mermaidModulePromise = null;
let mermaidRenderSequence = 0;
const customColor = {
  sk:'#9fc5ff', li:'#b9f59e', vi:'#cdb7ff',
  accent:'#ffd3d8', warn:'#ffe08a', mute:'rgba(255,255,255,.72)'
};
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s).replace(/`/g,'&#96;'); }
function slug(s){
  const base = String(s).replace(/<[^>]+>/g,'').trim().toLowerCase()
    .replace(/[\s　]+/g,'-').replace(/[!"#$%&'()*+,./:;<=>?@[\\\]^`{|}~]/g,'');
  return base || 'section';
}
function uniqueSlugFactory(){
  const used = new Map();
  return function(text){
    let id = slug(text);
    const n = used.get(id) || 0;
    used.set(id, n + 1);
    if(n) id += '-' + (n + 1);
    return id;
  };
}
function colorizeEscaped(html){
  let t = html;
  t = t.replace(/&lt;s=(?:&quot;|&#39;|&apos;|['"]|)([^&"'>\s]+?)(?:&quot;|&#39;|&apos;|['"]|)&gt;([\s\S]*?)&lt;\/s&gt;/g,
    (_, size, inner) => `<span style="font-size:${escapeAttr(size)}">${inner}</span>`);
  t = t.replace(/&lt;f=(?:&quot;|&#39;|&apos;|['"]|)([^&"'>]+?)(?:&quot;|&#39;|&apos;|['"]|)&gt;([\s\S]*?)&lt;\/f&gt;/g,
    (_, font, inner) => `<span style="font-family:'${escapeAttr(font)}', var(--font), sans-serif">${inner}</span>`);
  t = t.replace(/&lt;(?:c|col)=(?:&quot;|&#39;|&apos;|['"]|)([^&"'>\s]+?)(?:&quot;|&#39;|&apos;|['"]|)&gt;([\s\S]*?)&lt;\/(?:c|col)&gt;/g,
    (_, color, inner) => `<span style="color:${customColor[color] || escapeAttr(color)}">${inner}</span>`);
  t = t.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
  return t;
}
function inline(src){
  const codeParts = [];
  const htmlParts = [];

  function stashHtml(html){
    const key = `\u0000HTML${htmlParts.length}\u0000`;
    htmlParts.push(html);
    return key;
  }

  let s = String(src).replace(/`([^`\n]+?)`/g, (_, code) => {
    const key = `\u0000CODE${codeParts.length}\u0000`;
    codeParts.push(`<code>${escapeHtml(code)}</code>`);
    return key;
  });

  s = escapeHtml(s);
  s = colorizeEscaped(s);
  s = s.replace(/\[video:([^\]\s]+)\]/g, (_, url) => {
    const type = /\.webm(?:[?#].*)?$/i.test(url) ? 'video/webm' : 'video/mp4';
    return stashHtml(`<video class="md-video" controls playsinline preload="metadata"><source src="${escapeAttr(url)}" type="${type}">お使いのブラウザは動画再生に対応していません。</video>`);
  });

  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;([^&]*)&quot;)?\)/g, (_, alt, url, title) => {
    return stashHtml(`<img src="${escapeAttr(url)}" alt="${escapeAttr(alt)}"${title ? ` title="${escapeAttr(title)}"` : ''}>`);
  });

  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;([^&]*)&quot;)?\)/g, (_, text, url, title) => {
    return stashHtml(`<a href="${escapeAttr(url)}"${title ? ` title="${escapeAttr(title)}"` : ''}>${text}</a>`);
  });

  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/_([^_]+)_/g, '<em>$1</em>');

  htmlParts.forEach((html, i) => {
    s = s.replace(`\u0000HTML${i}\u0000`, html);
  });

  codeParts.forEach((html, i) => {
    s = s.replace(`\u0000CODE${i}\u0000`, html);
  });

  return s;
}
function isTableSep(line){
  if(!line.includes('|')) return false;
  const cells = splitTableRow(line);
  return cells.length > 0 && cells.every(c => /^:?-{3,}:?$/.test(c.trim()));
}
function splitTableRow(line){
  const marker = '\u0000PIPE\u0000';
  let s = line.trim().replace(/\\\|/g, marker);
  if(s.startsWith('|')) s = s.slice(1);
  if(s.endsWith('|')) s = s.slice(0, -1);
  return s.split('|').map(c => c.replaceAll(marker, '|').trim());
}
function renderTable(lines){
  const header = splitTableRow(lines[0]);
  const rows = lines.slice(2).map(splitTableRow);
  let html = '<div class="table-wrap"><table><thead><tr>';
  html += header.map(c => `<th>${inline(c)}</th>`).join('');
  html += '</tr></thead><tbody>';
  html += rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('');
  html += '</tbody></table></div>';
  return html;
}
function isLooseTableLine(line){
  if(!line.includes('|') || line.includes('\\|')) return false;
  const cells = splitTableRow(line);
  return cells.length >= 2 && cells.some(c => c.trim() !== '');
}
function renderLooseTable(lines){
  const rows = lines.map(splitTableRow);
  let html = '<div class="table-wrap"><table><tbody>';
  html += rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('');
  html += '</tbody></table></div>';
  return html;
}
function renderCodeBlock(source, language){
  const code = String(source);
  const lang = String(language || '').trim().toLowerCase();
  if(lang !== 'mermaid'){
    return `<pre><code>${escapeHtml(code)}</code></pre>`;
  }
  return `<section class="mermaid-viewer" data-mermaid-viewer>
    <div class="mermaid-toolbar">
      <span class="mermaid-help">図をドラッグして移動／ホイールまたはボタンで拡大・縮小</span>
      <div class="mermaid-actions" aria-label="図の表示操作">
        <button type="button" data-mermaid-action="zoom-out" aria-label="縮小" title="縮小">−</button>
        <output class="mermaid-scale" aria-live="polite">--%</output>
        <button type="button" data-mermaid-action="zoom-in" aria-label="拡大" title="拡大">＋</button>
        <button type="button" data-mermaid-action="reset">全体表示</button>
      </div>
    </div>
    <div class="mermaid-viewport" tabindex="0" role="group" aria-label="操作できるフローチャート">
      <div class="mermaid-stage"><div class="mermaid-status">図を読み込んでいます…</div></div>
    </div>
    <details class="mermaid-source-wrap">
      <summary>Mermaidコードを見る</summary>
      <pre class="mermaid-source"><code>${escapeHtml(code)}</code></pre>
    </details>
  </section>`;
}
function renderMarkdown(md){
  const makeId = uniqueSlugFactory();
  const lines = String(md).replace(/\r\n?/g,'\n').split('\n');
  let html = '';
  let paragraph = [];
  let listStack = [];
  let inCode = false;
  let code = [];
  let codeLanguage = '';
  let inFaq = false;
  function closeLists(){ while(listStack.length){ html += `</${listStack.pop()}>`; } }
  function closeFaq(){ if(inFaq){ closeLists(); html += '</article>'; inFaq = false; } }
  function flushParagraph(){
    if(!paragraph.length) return;
    html += `<p>${inline(paragraph.join('\n')).replace(/\n/g,'<br>')}</p>`;
    paragraph = [];
  }
  for(let i=0; i<lines.length; i++){
    const line = lines[i];
    const fence = line.trim().match(/^```\s*([A-Za-z0-9_-]*)\s*$/);
    if(fence){
      flushParagraph(); closeLists();
      if(inCode){
        html += renderCodeBlock(code.join('\n'), codeLanguage);
        code = [];
        codeLanguage = '';
        inCode = false;
      }else{
        inCode = true;
        codeLanguage = fence[1] || '';
      }
      continue;
    }
    if(inCode){ code.push(line); continue; }
    if(line.includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1])){
      flushParagraph(); closeLists();
      const block = [line, lines[i + 1]];
      i += 2;
      while(i < lines.length && lines[i].includes('|') && lines[i].trim() !== ''){ block.push(lines[i]); i++; }
      i--;
      html += renderTable(block);
      continue;
    }
    if(isLooseTableLine(line)){
      flushParagraph(); closeLists();
      const block = [line];
      let j = i + 1;
      while(j < lines.length && isLooseTableLine(lines[j]) && !isTableSep(lines[j])){
        block.push(lines[j]);
        j++;
      }
      html += renderLooseTable(block);
      i = j - 1;
      continue;
    }
    const heading = line.match(/^(#{1,4})\s+(.+)$/);
    if(heading){
      flushParagraph(); closeLists();
      const level = heading[1].length;
      const text = heading[2].trim();
      const id = makeId(text);
      if(level <= 2){ closeFaq(); html += `<h${level} id="${id}">${inline(text)}</h${level}>`; }
      else if(level === 3){ closeFaq(); html += `<article class="faq-card"><h3 id="${id}">${inline(text)}</h3>`; inFaq = true; }
      else{ html += `<h4 id="${id}">${inline(text)}</h4>`; }
      continue;
    }
    if(/^\s*---+\s*$/.test(line)){ flushParagraph(); closeLists(); html += '<hr>'; continue; }
    if(/^>\s?/.test(line)){ flushParagraph(); closeLists(); html += `<blockquote>${inline(line.replace(/^>\s?/,''))}</blockquote>`; continue; }
    const ul = line.match(/^(\s*)[-*+]\s+(.+)$/);
    const ol = line.match(/^(\s*)\d+\.\s+(.+)$/);
    if(ul || ol){
      flushParagraph();
      const m = ul || ol;
      const type = ul ? 'ul' : 'ol';
      const depth = Math.floor(m[1].length / 2) + 1;
      while(listStack.length > depth){ html += `</${listStack.pop()}>`; }
      if(listStack.length === depth && listStack[depth - 1] !== type){ html += `</${listStack.pop()}>`; }
      while(listStack.length < depth){ html += `<${type}>`; listStack.push(type); }
      html += `<li>${inline(m[2])}</li>`;
      continue;
    }
    if(line.trim() === ''){ flushParagraph(); closeLists(); continue; }
    if(listStack.length) closeLists();
    paragraph.push(line);
  }
  if(inCode){ html += renderCodeBlock(code.join('\n'), codeLanguage); }
  flushParagraph(); closeLists(); closeFaq();
  return html;
}

function clamp(value, min, max){
  return Math.min(max, Math.max(min, value));
}
function loadMermaidModule(){
  if(!mermaidModulePromise){
    mermaidModulePromise = import(MERMAID_MODULE_URL).then(module => {
      const mermaid = module.default;
      mermaid.initialize({
        startOnLoad:false,
        securityLevel:'strict',
        theme:'base',
        themeVariables:{
          fontFamily:'NotoSansJPBold, Noto Sans JP, Meiryo, sans-serif',
          fontSize:'16px',
          primaryColor:'#eaf2ff',
          primaryTextColor:'#172b4d',
          primaryBorderColor:'#4c78a8',
          lineColor:'#64748b',
          secondaryColor:'#fff4d6',
          tertiaryColor:'#f8fafc',
          clusterBkg:'#f8fafc',
          clusterBorder:'#cbd5e1',
          edgeLabelBackground:'#ffffff'
        },
        flowchart:{
          htmlLabels:false,
          useMaxWidth:false,
          curve:'linear'
        }
      });
      return mermaid;
    });
  }
  return mermaidModulePromise;
}
function showMermaidError(viewer, message){
  const stage = viewer.querySelector('.mermaid-stage');
  if(stage){
    stage.style.transform = 'translate(20px, 20px)';
    stage.innerHTML = `<div class="mermaid-status is-error"><strong>図を表示できませんでした。</strong><br>${escapeHtml(message)}</div>`;
  }
  const scaleOutput = viewer.querySelector('.mermaid-scale');
  if(scaleOutput) scaleOutput.textContent = '--%';
  viewer.dataset.mermaidState = 'error';
}
function setupMermaidPanZoom(viewer, stage, svg){
  const viewport = viewer.querySelector('.mermaid-viewport');
  const scaleOutput = viewer.querySelector('.mermaid-scale');
  const viewBox = svg.viewBox && svg.viewBox.baseVal;
  let diagramWidth = viewBox && viewBox.width > 0 ? viewBox.width : parseFloat(svg.getAttribute('width'));
  let diagramHeight = viewBox && viewBox.height > 0 ? viewBox.height : parseFloat(svg.getAttribute('height'));
  if(!(diagramWidth > 0) || !(diagramHeight > 0)){
    const box = svg.getBBox();
    diagramWidth = Math.max(1, box.width);
    diagramHeight = Math.max(1, box.height);
  }
  svg.setAttribute('width', String(diagramWidth));
  svg.setAttribute('height', String(diagramHeight));
  svg.style.width = `${diagramWidth}px`;
  svg.style.height = `${diagramHeight}px`;

  const minScale = .08;
  const maxScale = 3;
  const state = {x:0, y:0, scale:1};
  let drag = null;
  let interacted = false;

  function applyTransform(){
    stage.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
    if(scaleOutput) scaleOutput.textContent = `${Math.round(state.scale * 100)}%`;
  }
  function fitToViewport(){
    const width = viewport.clientWidth;
    const height = viewport.clientHeight;
    if(!width || !height) return;
    const padding = 28;
    state.scale = clamp(Math.min(
      (width - padding * 2) / diagramWidth,
      (height - padding * 2) / diagramHeight
    ), minScale, 1);
    state.x = (width - diagramWidth * state.scale) / 2;
    state.y = (height - diagramHeight * state.scale) / 2;
    applyTransform();
  }
  function zoomAt(factor, clientX, clientY){
    const rect = viewport.getBoundingClientRect();
    const pointX = clientX - rect.left;
    const pointY = clientY - rect.top;
    const nextScale = clamp(state.scale * factor, minScale, maxScale);
    const diagramX = (pointX - state.x) / state.scale;
    const diagramY = (pointY - state.y) / state.scale;
    state.x = pointX - diagramX * nextScale;
    state.y = pointY - diagramY * nextScale;
    state.scale = nextScale;
    interacted = true;
    applyTransform();
  }
  function zoomAtCenter(factor){
    const rect = viewport.getBoundingClientRect();
    zoomAt(factor, rect.left + rect.width / 2, rect.top + rect.height / 2);
  }

  viewport.addEventListener('pointerdown', event => {
    if(event.button !== 0) return;
    drag = {
      pointerId:event.pointerId,
      clientX:event.clientX,
      clientY:event.clientY,
      x:state.x,
      y:state.y
    };
    viewport.setPointerCapture(event.pointerId);
    viewport.classList.add('is-dragging');
    interacted = true;
    event.preventDefault();
  });
  viewport.addEventListener('pointermove', event => {
    if(!drag || drag.pointerId !== event.pointerId) return;
    state.x = drag.x + event.clientX - drag.clientX;
    state.y = drag.y + event.clientY - drag.clientY;
    applyTransform();
  });
  function finishDrag(event){
    if(!drag || drag.pointerId !== event.pointerId) return;
    if(viewport.hasPointerCapture(event.pointerId)) viewport.releasePointerCapture(event.pointerId);
    drag = null;
    viewport.classList.remove('is-dragging');
  }
  viewport.addEventListener('pointerup', finishDrag);
  viewport.addEventListener('pointercancel', finishDrag);
  viewport.addEventListener('wheel', event => {
    event.preventDefault();
    zoomAt(Math.exp(-event.deltaY * .0015), event.clientX, event.clientY);
  }, {passive:false});
  viewport.addEventListener('dblclick', () => {
    interacted = false;
    fitToViewport();
  });
  viewport.addEventListener('keydown', event => {
    const step = event.shiftKey ? 70 : 30;
    if(event.key === '+' || event.key === '=') zoomAtCenter(1.2);
    else if(event.key === '-') zoomAtCenter(1 / 1.2);
    else if(event.key === '0'){
      interacted = false;
      fitToViewport();
    }else if(event.key === 'ArrowLeft') state.x += step;
    else if(event.key === 'ArrowRight') state.x -= step;
    else if(event.key === 'ArrowUp') state.y += step;
    else if(event.key === 'ArrowDown') state.y -= step;
    else return;
    if(event.key.startsWith('Arrow')){
      interacted = true;
      applyTransform();
    }
    event.preventDefault();
  });

  viewer.querySelector('[data-mermaid-action="zoom-out"]').addEventListener('click', () => zoomAtCenter(1 / 1.2));
  viewer.querySelector('[data-mermaid-action="zoom-in"]').addEventListener('click', () => zoomAtCenter(1.2));
  viewer.querySelector('[data-mermaid-action="reset"]').addEventListener('click', () => {
    interacted = false;
    fitToViewport();
  });

  if('ResizeObserver' in window){
    const observer = new ResizeObserver(() => {
      if(!interacted) fitToViewport();
    });
    observer.observe(viewport);
  }
  requestAnimationFrame(fitToViewport);
}
async function renderMermaidViewer(viewer, mermaid){
  const source = viewer.querySelector('.mermaid-source code').textContent.trim();
  const stage = viewer.querySelector('.mermaid-stage');
  viewer.dataset.mermaidState = 'loading';
  try{
    const id = `faq-mermaid-${++mermaidRenderSequence}`;
    const rendered = await mermaid.render(id, source);
    stage.style.transform = '';
    stage.innerHTML = rendered.svg;
    const svg = stage.querySelector('svg');
    if(!svg) throw new Error('SVGを生成できませんでした。');
    if(rendered.bindFunctions) rendered.bindFunctions(stage);
    setupMermaidPanZoom(viewer, stage, svg);
    viewer.dataset.mermaidState = 'ready';
  }catch(error){
    showMermaidError(viewer, error && error.message ? error.message : String(error));
  }
}
async function initializeMermaidBlocks(){
  const viewers = Array.from(content.querySelectorAll('[data-mermaid-viewer]'));
  if(!viewers.length) return;
  let mermaid;
  try{
    mermaid = await loadMermaidModule();
  }catch(error){
    const message = 'Mermaidの読込に失敗しました。ネットワーク接続をご確認ください。';
    viewers.forEach(viewer => showMermaidError(viewer, message));
    return;
  }
  for(const viewer of viewers){
    await renderMermaidViewer(viewer, mermaid);
  }
}

function decodeHtmlEntities(s){
  const textarea = document.createElement('textarea');
  textarea.innerHTML = String(s);
  return textarea.value;
}
function htmlToPlainText(html){
  return decodeHtmlEntities(String(html)
    .replace(/<\s*\/\s*br\s*>/gi, '\n')
    .replace(/<\s*br\s*\/?\s*>/gi, '\n')
    .replace(/<[^>]+>/g, '')
    .replace(/\n{3,}/g, '\n\n'))
    .trim();
}
function extractHistory(md){
  let body = String(md);
  let history = '';
  const marked = body.match(/<!--\s*(?:history|update-history|更新履歴):start\s*-->([\s\S]*?)<!--\s*(?:history|update-history|更新履歴):end\s*-->/i);
  if(marked){
    history = marked[1].trim();
    body = body.replace(marked[0], '').trimStart();
    return {body, history};
  }
  const legacy = body.match(/^\s*<!--\s*よくある質問（FAQ）\s*-->\s*(<strong[\s\S]*?最終更新日[\s\S]*?<\/strong>)\s*(<div[^>]*overflow\s*:\s*auto[^>]*>[\s\S]*?<\/div>)\s*(?:<br\s*\/?>|<\/br>)?/i);
  if(legacy){
    history = `${htmlToPlainText(legacy[1])}\n\n${htmlToPlainText(legacy[2])}`.trim();
    body = body.replace(legacy[0], '').trimStart();
  }
  return {body, history};
}
function renderHistory(history){
  const text = String(history || '').replace(/\r\n?/g, '\n').trim();
  if(!text) return '<span class="history-empty">faq.md の上部に更新履歴ブロックを追加すると、ここに表示されます。</span>';
  const lines = text.split('\n');
  const first = lines[0].trim();
  const hasLastUpdate = /^最終更新日/.test(first);
  const lastUpdate = hasLastUpdate ? lines.shift().trim() : '更新履歴';
  const log = lines.join('\n').trim();
  return `<p class="history-last">${inline(lastUpdate)}</p><div class="history-log">${escapeHtml(log || '更新内容なし')}</div>`;
}
function setHistoryVisible(hasHistory){
  historyToggle.hidden = !hasHistory;
  if(!hasHistory){
    historyPanel.hidden = true;
    historyToggle.setAttribute('aria-expanded', 'false');
  }
}

function buildToc(){
  const heads = Array.from(content.querySelectorAll('h2'));
  tocList.innerHTML = heads.length ? heads.map(h => `<a href="#${h.id}">${h.textContent}</a>`).join('') : '<span style="padding:8px 10px;color:var(--muted);font-size:14px;">項目なし</span>';
}
function applySearch(){
  const q = searchInput.value.trim().toLowerCase();
  const cards = Array.from(content.querySelectorAll('.faq-card'));
  let visible = 0;
  cards.forEach(card => {
    const hit = !q || card.textContent.toLowerCase().includes(q);
    card.style.display = hit ? '' : 'none';
    if(hit) visible++;
  });
  noResults.style.display = (q && cards.length && visible === 0) ? 'block' : 'none';
}
async function load(){
  try{
    const res = await fetch(MD_FILE, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const md = await res.text();
    const extracted = extractHistory(md);
    const hasHistory = !!extracted.history.trim();
    historyContent.innerHTML = renderHistory(extracted.history);
    setHistoryVisible(hasHistory);
    content.innerHTML = renderMarkdown(extracted.body);
    buildToc();
    applySearch();
    void initializeMermaidBlocks();
  }catch(err){
    setHistoryVisible(false);
    content.innerHTML = `<div class="error-message"><strong>faq.md を読み込めませんでした。</strong><br>GitHub PagesなどのWebサーバー上で開いてください。ローカル確認の場合は、VS CodeのLive Server等を使うと読み込めます。<br><code>${escapeHtml(err.message || err)}</code></div>`;
    tocList.innerHTML = '<span style="padding:8px 10px;color:var(--muted);font-size:14px;">読み込み失敗</span>';
  }
}
searchInput.addEventListener('input', applySearch);
historyToggle.addEventListener('click', () => {
  const open = historyPanel.hidden;
  historyPanel.hidden = !open;
  historyToggle.setAttribute('aria-expanded', String(open));
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !historyPanel.hidden){
    historyPanel.hidden = true;
    historyToggle.setAttribute('aria-expanded', 'false');
  }
});
load();
})();
</script>
